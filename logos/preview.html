<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monifa Logo Concepts</title>
    <style>
      :root { color-scheme: light; --paper: #f4f7f3; --ink: #17312e; --muted: #647570; --line: #cbd5cf; --surface: #e9eeea; }
      :root[data-theme="dark"] { color-scheme: dark; --paper: #101715; --ink: #dce8e2; --muted: #90a39b; --line: #34443e; --surface: #1c2723; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); font-family: Manrope, Inter, system-ui, sans-serif; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 24px; padding: 48px clamp(20px, 6vw, 80px) 28px; border-bottom: 1px solid var(--line); }
      h1 { margin: 0; font-size: clamp(30px, 5vw, 58px); letter-spacing: 0; line-height: 1; }
      header p { margin: 10px 0 0; color: var(--muted); }
      button { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; font-size: 20px; }
      main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); }
      article { min-width: 0; padding: clamp(24px, 5vw, 64px); background: var(--paper); }
      .stage { min-height: 360px; display: grid; place-items: center; background: var(--surface); }
      img { width: min(64%, 320px); height: auto; filter: drop-shadow(0 18px 28px rgb(23 63 58 / 15%)); }
      .meta { display: grid; grid-template-columns: auto 1fr; gap: 18px; padding-top: 22px; }
      .number { font: 700 13px ui-monospace, monospace; color: #e9664c; }
      h2 { margin: 0 0 7px; font-size: 20px; letter-spacing: 0; }
      article p { margin: 0; color: var(--muted); line-height: 1.55; }
      .favicon { display: inline-flex; gap: 8px; margin-top: 16px; padding: 8px; background: var(--surface); }
      .favicon img { width: 16px; height: 16px; filter: none; }
      .favicon img:last-child { width: 32px; height: 32px; }
      @media (max-width: 720px) { header { align-items: center; } main { grid-template-columns: 1fr; } .stage { min-height: 280px; } }
    </style>
  </head>
  <body>
    <header>
      <div><h1>Monifa</h1><p>Web App logo concept study</p></div>
      <button id="theme" type="button" title="切换明暗背景" aria-label="切换明暗背景">◐</button>
    </header>
    <main>
      <article>
        <div class="stage"><img src="concepts/01-timefold.svg" alt="Timefold logo" /></div>
        <div class="meta"><span class="number">01</span><div><h2>Timefold 时间折叠</h2><p>最直接的品牌进化：M 是主体，右上角的珊瑚弧代表正在流逝的 30 秒。</p><span class="favicon"><img src="concepts/01-timefold.svg" alt="" /><img src="concepts/01-timefold.svg" alt="" /></span></div></div>
      </article>
      <article>
        <div class="stage"><img src="concepts/02-code-dial.svg" alt="Code Dial logo" /></div>
        <div class="meta"><span class="number">02</span><div><h2>Code Dial 验证码盘</h2><p>把验证码倒计时变成仪表盘，中心 M 像被保护的核心，产品语义最完整。</p><span class="favicon"><img src="concepts/02-code-dial.svg" alt="" /><img src="concepts/02-code-dial.svg" alt="" /></span></div></div>
      </article>
      <article>
        <div class="stage"><img src="concepts/03-key-bridge.svg" alt="Key Bridge logo" /></div>
        <div class="meta"><span class="number">03</span><div><h2>Key Bridge 密钥桥</h2><p>两条身份通道汇聚成 M，强调多 SSO 与统一身份入口，结构最简洁。</p><span class="favicon"><img src="concepts/03-key-bridge.svg" alt="" /><img src="concepts/03-key-bridge.svg" alt="" /></span></div></div>
      </article>
      <article>
        <div class="stage"><img src="concepts/04-six-beat.svg" alt="Six Beat logo" /></div>
        <div class="meta"><span class="number">04</span><div><h2>Six Beat 六位脉冲</h2><p>六个粗粒度码块组成抽象 M，珊瑚色块表示当前跳动的一位，辨识度最独特。</p><span class="favicon"><img src="concepts/04-six-beat.svg" alt="" /><img src="concepts/04-six-beat.svg" alt="" /></span></div></div>
      </article>
    </main>
    <script>
      const button = document.querySelector("#theme");
      button.addEventListener("click", () => {
        const root = document.documentElement;
        root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
      });
    </script>
  </body>
</html>
