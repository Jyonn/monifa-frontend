<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Monifa Six Beat</title>
  <desc id="desc">Six code blocks pulse in the silhouette of an M.</desc>
  <g id="background">
    <rect width="512" height="512" rx="96" fill="#173F3A"/>
  </g>
  <g id="code-blocks" fill="#E6FF59">
    <rect x="88" y="128" width="72" height="256" rx="16"/>
    <rect x="176" y="128" width="72" height="168" rx="16"/>
    <rect x="264" y="216" width="72" height="168" rx="16"/>
    <rect x="352" y="128" width="72" height="256" rx="16"/>
  </g>
  <g id="active-code">
    <rect x="264" y="128" width="72" height="72" rx="16" fill="#E9664C"/>
    <rect x="176" y="312" width="72" height="72" rx="16" fill="#F4F7F3"/>
  </g>
</svg>
